    - generic [ref=e1103]:
      - heading "设计方建议" [level=3] [ref=e1104]
      - paragraph [ref=e1105]: 色板取 A · 石墨，方向取 01 静默画布 为默认形态、 04 工作台 作为 Coding Agent 场景的可切换布局、 05 聚光 作为 Alt+Space 的浮层形态。
      - paragraph [ref=e1106]: 理由：三者不是竞争关系，而是同一个产品的三种尺度 —— 静默画布是日常形态， 工作台是复杂任务形态，聚光是瞬时形态。它们共享同一套 token、同一套组件语义， 因此可以共存，且不违反文档第 2 条「不允许为完成第一版而使用阻碍未来扩展的架构」。
      - paragraph [ref=e1107]: 02 对话即产品的问题不是不好，而是太容易被误认为是 ChatGPT 客户端； 03 环境仪表的信息架构值得吸收（设备一等公民、状态诚实），但把仪表层做成首页会稀释 「Agent 优先」的产品主张 —— 建议把它的仪表排版并入 01 的 Dashboard。